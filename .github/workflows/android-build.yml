name: Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PATH: android/app/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build -- --mode production

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Verify keystore
        run: |
          ls -la android/app

      - name: Diagnose LevelPlay dependency
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseCompileClasspath > deps.txt || true
          echo "===== RESOLVED VERSION ====="
          grep -i -A2 -B2 "mediation-sdk" deps.txt || echo "NOT FOUND IN DEPENDENCY TREE"

          echo ""
          echo "===== LOOKING FOR THE ACTUAL AAR FILE ====="
          AAR_PATH=$(find ~/.gradle/caches/modules-2 -iname "mediation-sdk-9.4.0.aar" 2>/dev/null | head -1)
          echo "AAR found at: $AAR_PATH"

          if [ -n "$AAR_PATH" ]; then
            echo ""
            echo "===== LISTING CLASSES INSIDE THE AAR ====="
            mkdir -p /tmp/aar_inspect
            cp "$AAR_PATH" /tmp/aar_inspect/mediation-sdk.zip
            cd /tmp/aar_inspect
            unzip -o mediation-sdk.zip -d extracted > /dev/null
            echo "--- Top-level contents of AAR ---"
            ls -la extracted
            if [ -f extracted/classes.jar ]; then
              echo "--- Packages inside classes.jar (grep LevelPlay) ---"
              unzip -l extracted/classes.jar | grep -i "LevelPlay\|unity3d/mediation" | head -50
              echo "--- Total class count ---"
              unzip -l extracted/classes.jar | grep -c "\.class$"
            else
              echo "NO classes.jar FOUND INSIDE THE AAR!"
            fi
          else
            echo "AAR file not found in Gradle cache — cannot inspect."
          fi

      - name: Build Signed AAB
        run: |
          cd android
          ./gradlew :app:bundleRelease --stacktrace
