apply plugin: 'com.android.application'

android {
    namespace "com.rebh.app"

    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.rebh.app"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode = 47
        versionName = "1.0.45"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // Unity LevelPlay (ironSource) mediation SDK
    implementation "com.unity3d.ads-mediation:mediation-sdk:$levelPlayMediationSdkVersion"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

/* =====================================================================
 * Diagnostic task مؤقت: بيفحص إذا كانت مكتبة mediation-sdk فعلاً
 * موجودة في releaseCompileClasspath، وبيفتحها ويشوف هل فيها كلاسات
 * com.unity3d.mediation.* ولا لأ. شيله بعد ما تتحل المشكلة.
 * ===================================================================== */
tasks.register('diagnoseLevelPlay') {
    doLast {
        def config = configurations.getByName('releaseCompileClasspath')
        def resolved = config.resolvedConfiguration.resolvedArtifacts

        println "===== كل الـ dependencies اللي فيها unity3d ====="
        resolved.findAll { it.file.name.toLowerCase().contains('unity3d') || it.file.name.toLowerCase().contains('mediation') }
                .each { println "  -> ${it.file.absolutePath} (${it.file.length()} bytes)" }

        def mediationArtifact = resolved.find { it.file.name.contains('mediation-sdk') }

        if (mediationArtifact == null) {
            println "===== mediation-sdk مش موجودة في releaseCompileClasspath خالص! ====="
            println "===== القائمة الكاملة للـ classpath: ====="
            config.files.sort { it.name }.each { println "  ${it.name}" }
        } else {
            def aarFile = mediationArtifact.file
            println "===== لقيت mediation-sdk: ${aarFile.absolutePath} (${aarFile.length()} bytes) ====="

            def tmpDir = file("${buildDir}/levelplay-diagnose")
            tmpDir.deleteDir()
            tmpDir.mkdirs()
            copy {
                from zipTree(aarFile)
                into tmpDir
            }

            def classesJar = file("${tmpDir}/classes.jar")
            if (!classesJar.exists()) {
                println "===== !! مفيش classes.jar جوه الـ AAR !! محتويات الـ AAR: ====="
                tmpDir.eachFileRecurse { println "  ${it.path.replace(tmpDir.path, '')}" }
            } else {
                println "===== classes.jar موجود (${classesJar.length()} bytes) — بندور جوه على com/unity3d/mediation ====="
                def zf = new java.util.zip.ZipFile(classesJar)
                def entries = zf.entries().findAll { it.name.startsWith('com/unity3d/mediation/') }
                println "===== عدد الكلاسات في com/unity3d/mediation: ${entries.size()} ====="
                entries.take(40).each { println "  ${it.name}" }
                zf.close()
            }
        }
    }
}
